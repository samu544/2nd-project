
name: TV Guide & Encode

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Main Repo
        uses: actions/checkout@v4

      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, dom, mbstring, json, libxml

      - name: Run All Scripts
        run: |
          mkdir -p sch

          for file in private/sch/*.php; do
            [ -f "$file" ] && php "$file"
          done

          for file in private/sch/*.py; do
            [ -f "$file" ] && python "$file"
          done

      - name: Merge & Encode
        env:
          ENCODE: "true"
          OUTPUT_DIR: ${{ github.workspace }}/sch
          PYTHON_SCRIPT: ${{ secrets.x7Kp9mQ44 }}
        run: |
          python -c "import json,glob; json.dump(sum([json.load(open(f)) for f in glob.glob('sch/*.json') if not f.endswith('all.json')],[]),open('sch/all.json','w'),ensure_ascii=False,separators=(',',':'))"
          python -c "$PYTHON_SCRIPT"

      - name: Push All JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sch/all.json

          if ! git diff --cached --quiet; then
            git commit -m "Update All JSON"
            git push
          else
            echo "No changes to push."
          fi
