
name: TV Guide & Encode

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Main Repository
      - name: Checkout Main Repo
        uses: actions/checkout@v4

      # Private Repository
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      # PHP Setup
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, dom, mbstring, json, libxml

      # Python Setup
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Run Private Runner
      - name: Run Private Runner
        env:
          PRIVATE_PATH: private/sch
          OUTPUT_DIR: ${{ github.workspace }}/sch
        run: |
          python private/sch/runner.py

      # Encode JSON
      - name: Encode Output
        env:
          ENCODE: "true"
          OUTPUT_DIR: ${{ github.workspace }}/sch
          PYTHON_SCRIPT: ${{ secrets.x7Kp9mQ44 }}
        run: |
          python -c "$PYTHON_SCRIPT" > /dev/null 2>&1

      # Push only all.json to Main Repo
      - name: Push All JSON to Main Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sch/all.json

          if ! git diff --cached --quiet; then
            git commit -m "Update All TV Guide JSON"
            git push
          else
            echo "No changes to push."
          fi
