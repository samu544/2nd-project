
name: Crawl & Build Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: crawl-build-playlist
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # 1. Checkout Main Repo
      - name: Checkout Main Repo
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      # 2. Checkout Private Repo
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: private
          sparse-checkout: |
            emb
          persist-credentials: false

      # 3. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 4. Run Crawler
      - name: Run Crawler
        working-directory: private/emb
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail

          OUTPUT_DIR="$GITHUB_WORKSPACE/main/output2"

          mkdir -p "$OUTPUT_DIR"

          echo "Starting crawler..."
          echo "Output: $OUTPUT_DIR"

          python streamfree_full.py \
            -o "$OUTPUT_DIR"

          echo "Crawler completed."

          echo "Generated files:"
          find "$OUTPUT_DIR" -type f -print

      # 5. Encode Output
      - name: Encode Output
        working-directory: main
        env:
          ENCODE: "true"
          OUTPUT_DIR: "main/output2"
          PYTHON_SCRIPT: ${{ secrets.x7Kp9mQ44 }}
        run: |
          set -euo pipefail

          if [ -z "$PYTHON_SCRIPT" ]; then
            echo "ERROR: Python script secret is empty."
            exit 1
          fi

          echo "Starting encoding..."

          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Working directory: $(pwd)"

          echo "Output directory:"
          echo "$GITHUB_WORKSPACE/$OUTPUT_DIR"

          if [ ! -d "$GITHUB_WORKSPACE/$OUTPUT_DIR" ]; then
            echo "ERROR: Output directory does not exist."
            exit 1
          fi

          echo "Files before encoding:"
          find "$GITHUB_WORKSPACE/$OUTPUT_DIR" -type f -print

          printf '%s' "$PYTHON_SCRIPT" | python -

          echo "Encoding completed."

          echo "Files after encoding:"
          find "$GITHUB_WORKSPACE/$OUTPUT_DIR" -type f -print

      # 6. Commit & Push Output
      - name: Commit & Push Output
        working-directory: main
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f output2/

          if ! git diff --cached --quiet; then

            git commit -m "chore: update encoded playlist [skip ci]"

            git push origin HEAD:main

            echo "Push completed successfully."

          else
            echo "No changes detected. Skipping push."
          fi
