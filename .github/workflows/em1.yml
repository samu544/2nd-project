
name: StreamFree Crawl & Encode

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Main Repo
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run StreamFree
        working-directory: main
        run: |
          python ../private/emb/streamfree_full.py

      - name: Encode Output
        working-directory: main
        env:
          ENCODE: "true"
          OUTPUT_DIR: ${{ github.workspace }}/main/output2
          PYTHON_SCRIPT: ${{ secrets.x7Kp9mQ44 }}
        run: |
          python -c "$PYTHON_SCRIPT"

      - name: Push to Main Repo
        working-directory: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output2/

          if git diff --cached --quiet; then
            echo "No changes to push."
          else
            git commit -m "Update StreamFree JSON"
            git push
          fi
