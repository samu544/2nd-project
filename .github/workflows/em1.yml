name: Crawl & Build Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: crawl-build-playlist
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # 1. Checkout Main Repo
      - name: Checkout Main Repo
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      # 2. Checkout Private Repo
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: private
          sparse-checkout: |
            emb
          persist-credentials: false

      # 3. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 4. Run Crawler
      - name: Run Crawler
        working-directory: private/emb
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/main/output"

          rm -rf output
          ln -s "$GITHUB_WORKSPACE/main/output" output

          echo "Starting crawler..."

          python streamfree_full.py

      # 5. Encode New Output Files Only
      - name: Encode Output
        working-directory: main
        env:
          ENCODE: "true"
          OUTPUT_DIR: "main/output"
          PYTHON_SCRIPT: ${{ secrets.x7Kp9mQ44 }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail

          if [ "$ENCODE" = "true" ]; then

            if [ -z "$PYTHON_SCRIPT" ]; then
              echo "ERROR: Python script secret is empty."
              exit 1
            fi

            printf '%s' "$PYTHON_SCRIPT" | \
              ENCODE="$ENCODE" \
              OUTPUT_DIR="$OUTPUT_DIR" \
              python -

          fi

          echo "Encoding completed."

      # 6. Commit & Push
      - name: Commit & Push Output
        working-directory: main
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f output/

          if ! git diff --cached --quiet; then
            git commit -m "chore: update encoded playlist [skip ci]"
            git push origin HEAD:main
            echo "Output successfully pushed."
          else
            echo "No changes to commit."
          fi
