
name: Crawl & Build Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: crawl-build-playlist
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # 1. Checkout Main Repository
      - name: Checkout Main Repo
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      # 2. Checkout Private Repository
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: private
          sparse-checkout: |
            emb
          persist-credentials: false

      # 3. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 4. Run Main Crawler
      - name: Run Main Crawler
        working-directory: private/emb
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/main/output"

          rm -rf output
          ln -s "$GITHUB_WORKSPACE/main/output" output

          echo "Starting main crawler..."

          python streamfree_full.py

      # 5. Build StreamFree JSON
      - name: Build StreamFree JSON
        working-directory: private/emb
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -e

          echo "Starting StreamFree JSON builder..."

          python streamfree_full.py \
            -o "$GITHUB_WORKSPACE/main/output/streampk.json"

          echo "Validating original JSON..."

          python -m json.tool \
            "$GITHUB_WORKSPACE/main/output/streampk.json" > /dev/null

          echo "Original JSON validated."

      # 6. Validate Original Output
      - name: Validate Original Output
        working-directory: main
        run: |
          set -e

          test -d output
          test -n "$(find output -type f -print -quit)"

          echo "Original output files found."

      # 7. Encode Before Push
      - name: Encode Output Before Push
        working-directory: main
        env:
          ENCODE: "true"
          OUTPUT_DIR: "main/output"
          PYTHON_SCRIPT: ${{ secrets.x7Kp9mQ2 }}
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -euo pipefail

          if [ "$ENCODE" = "true" ]; then

            if [ -z "$PYTHON_SCRIPT" ]; then
              echo "ERROR: Python script secret is empty."
              exit 1
            fi

            echo "Starting encoding..."

            printf '%s' "$PYTHON_SCRIPT" | \
              ENCODE="$ENCODE" \
              OUTPUT_DIR="$OUTPUT_DIR" \
              python -

            echo "Encoding completed."

          else
            echo "Encoding disabled. Skipping."
          fi

      # 8. Validate Encoded Output
      - name: Validate Encoded Output
        working-directory: main
        env:
          ENCODE: "true"
        run: |
          set -e

          test -d output

          if [ "$ENCODE" = "true" ]; then
            python - <<'PY'
          import base64
          from pathlib import Path

          files = [
              p for p in Path("output").rglob("*")
              if p.is_file()
          ]

          if not files:
              raise SystemExit("No output files found.")

          for path in files:
              data = path.read_bytes()
              base64.b64decode(data, validate=True)
              print(f"Validated: {path}")

          print(f"Total validated: {len(files)}")
          PY
          else
            echo "Encoding disabled."
          fi

      # 9. Commit & Push
      - name: Commit & Push Output
        working-directory: main
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f output/

          if ! git diff --cached --quiet; then
            git commit -m "chore: update encoded playlist [skip ci]"
            git push origin HEAD:main

            echo "Output successfully pushed."
          else
            echo "No changes to commit."
          fi
